<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gr8s Network</title>
<style>
@font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(fonts/inter-400.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500; font-display: swap; src: url(fonts/inter-500.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url(fonts/inter-600.woff2) format("woff2"); }
:root {
  --bg: #f4f6f9; --dots: #dde2ea; --surface: #ffffff; --line: #e3e7ed; --line-strong: #cfd6df;
  --text: #1f2733; --muted: #6a7587; --faint: #98a2b3; --accent: #2f6fed; --accent-soft: #e8efff;
  --bad: #d92d20; --bad-soft: #fdecea; --warn: #c27c0e; --edge: #a3adbb; --group: rgba(225, 231, 239, 0.55);
  --chip: #f2edfe; --chip-text: #6941c6; --tile: #f2f4f7; --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 6px 16px rgba(16, 24, 40, 0.08);
  --kind-workload: #2f6fed; --kind-node: #667085; --kind-service: #7a5af8; --kind-outside: #12a150;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151b; --dots: #1e252e; --surface: #1a2029; --line: #2a323d; --line-strong: #39424f;
    --text: #e4e8ee; --muted: #9aa4b2; --faint: #6d7785; --accent: #6a9bff; --accent-soft: #1d2a45;
    --bad: #ff6b5f; --bad-soft: #3a1d1b; --warn: #e2a33a; --edge: #5d6876; --group: rgba(40, 48, 59, 0.55);
    --chip: #2a2140; --chip-text: #c3a9ff; --tile: #232a35; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
    --kind-workload: #6a9bff; --kind-node: #a0a9b6; --kind-service: #a38bff; --kind-outside: #3ccb7f;
  }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-feature-settings: "cv11", "tnum"; }
body { display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; margin: 12px 16px 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); flex: none; }
.group { display: inline-flex; align-items: center; gap: 6px; }
.label { color: var(--muted); font-size: 12px; }
select, input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 8px; padding: 5px 9px; }
input[type=search] { width: 190px; }
.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.segmented button, .plain { font: inherit; font-weight: 500; color: var(--muted); background: var(--surface); border: 0;
  padding: 5px 12px; cursor: pointer; }
.segmented button + button { border-left: 1px solid var(--line-strong); }
.segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.plain { border: 1px solid var(--line-strong); border-radius: 8px; }
.plain[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#status { margin-left: auto; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
#status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kind-outside); }
#status.bad { color: var(--bad); }
#status.bad::before { background: var(--bad); }
main { flex: 1; display: flex; min-height: 0; margin: 12px 16px; gap: 12px; }
#stage { flex: 1; position: relative; min-width: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
  background-color: var(--bg); background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 18px 18px; }
#graph, #cards { position: absolute; inset: 0; }
#cards { pointer-events: none; overflow: hidden; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
.card { position: absolute; left: 0; top: 0; width: 220px; padding: 10px 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); transform-origin: 0 0;
  transition: opacity .15s, box-shadow .15s, border-color .15s; will-change: transform; }
.card.hover { border-color: var(--line-strong); box-shadow: 0 2px 4px rgba(16, 24, 40, .08), 0 10px 24px rgba(16, 24, 40, .14); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.card.faded { opacity: .28; }
/* The doctor: a problem about the workload, or one elsewhere that holds it up. */
.card.cause { box-shadow: inset 4px 0 0 var(--bad), var(--shadow); }
.card.affected { box-shadow: inset 4px 0 0 var(--warn), var(--shadow); }
.card .top { display: flex; align-items: center; gap: 10px; }
.tile { position: relative; width: 34px; height: 34px; flex: none; border-radius: 9px; background: var(--tile); display: grid; place-items: center; }
.tile img { width: 20px; height: 20px; display: block; object-fit: contain; image-rendering: auto; }
.tile .mask { width: 20px; height: 20px; -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
.names { min-width: 0; flex: 1; }
.name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kind { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { flex: none; align-self: flex-start; font-size: 10.5px; font-weight: 600; color: var(--bad); background: var(--bad-soft);
  border-radius: 999px; padding: 1px 7px; }
.shield { position: absolute; right: -5px; bottom: -5px; width: 17px; height: 17px; padding: 1.5px; border-radius: 50%;
  color: var(--accent); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.shield svg { display: block; width: 14px; height: 14px; }
.policy { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.policy.denied { border-color: var(--bad); background: var(--bad-soft); }
.policy .conn { font-weight: 600; word-break: break-all; }
.policy .verdict { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-left: 6px; }
.policy.denied .verdict { color: var(--bad); }
.policy .side { margin-top: 6px; color: var(--muted); }
.policy .side b { color: var(--text); font-weight: 500; }
.suggestion { margin-top: 8px; }
.suggestion .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
  color: var(--muted); font-size: 11.5px; }
.suggestion pre { margin: 0; padding: 8px 10px; font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; overflow: auto; white-space: pre; }
.suggestion button { font: inherit; font-size: 11px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
.problem { border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.problem.held { border-left-color: var(--warn); }
.problem .title { font-weight: 600; }
.problem .meta { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.problem p { margin: 6px 0 0; }
.problem .next { color: var(--muted); }
.problem pre { margin: 6px 0 0; padding: 6px 8px; font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
.problem ul { margin: 6px 0 0; padding-left: 18px; }
.pill { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 600;
  color: var(--bad); background: var(--bad-soft); text-align: center; }
.pill.ok { color: var(--muted); background: var(--tile); }
.note { color: var(--faint); font-size: 11.5px; margin-top: 4px; }
.ports { display: flex; flex-wrap: nowrap; gap: 4px; margin-top: 8px; overflow: hidden; }
.chip { flex: none; font-size: 10.5px; font-weight: 500; color: var(--chip-text); background: var(--chip); border-radius: 6px;
  padding: 1px 6px; white-space: nowrap; }
.chip .proto { opacity: .65; margin-left: 2px; }
.chip.more { color: var(--muted); background: var(--tile); }
aside { width: 380px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); overflow: auto; padding: 16px; }
aside h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; word-break: break-all; }
aside h3 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 6px; }
aside .sub { color: var(--muted); margin-bottom: 10px; }
aside td, aside th { overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.dropped { color: var(--bad); }
.link { color: var(--accent); cursor: pointer; }
a.link { text-decoration: none; }
a.link:hover { text-decoration: underline; }
#flowtable { flex: none; height: 34%; overflow: auto; margin: 0 16px 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); }
#flowtable th { position: sticky; top: 0; background: var(--surface); }
#flowtable th, #flowtable td { padding: 6px 12px; white-space: nowrap; }
#flowtable tbody tr { cursor: pointer; }
#flowtable tbody tr:hover { background: var(--bg); }
</style>
</head>
<body>
<header>
  <span class="group"><span class="label">Namespace</span><select id="namespace"><option value="">All namespaces</option></select></span>
  <span class="group"><span class="label">Last</span>
    <select id="window"><option value="m1">1 minute</option><option value="m5" selected>5 minutes</option><option value="m15">15 minutes</option></select></span>
  <select id="verdict" aria-label="Verdict"><option value="all">All traffic</option><option value="dropped">Dropped only</option></select>
  <input id="search" type="search" placeholder="Find a workload" aria-label="Find a workload">
  <span class="segmented" role="group" aria-label="Layout">
    <button id="live" aria-pressed="true" title="Stable layout: nodes stay where they are as traffic changes">Live</button>
    <button id="flow" aria-pressed="false" title="Left to right, by where traffic flows">Flow</button>
  </span>
  <button id="tidy" class="plain" title="Lay the graph out again">Tidy</button>
  <button id="showflows" class="plain" aria-pressed="false" title="The latest flows, as the filters select them">Flows</button>
  <button id="showhealth" class="plain" aria-pressed="false" title="What the doctor finds wrong in the cluster">Health<span id="healthcount" class="pill ok">…</span></button>
  <span id="status" role="status">Reading the cluster's flows…</span>
</header>
<main>
  <div id="stage">
    <div id="graph"></div>
    <div id="cards"></div>
    <div id="empty" hidden></div>
  </div>
  <aside id="details" hidden></aside>
</main>
<section id="flowtable" hidden>
  <table><thead><tr><th>Time</th><th>Source</th><th>Destination</th><th>Port</th><th>Verdict</th><th>Details</th></tr></thead>
  <tbody id="flowrows"></tbody></table>
</section>
<script src="assets/cytoscape.js"></script>
<script src="assets/layout-base.js"></script>
<script src="assets/cose-base.js"></script>
<script src="assets/cytoscape-fcose.js"></script>
<script src="assets/dagre.js"></script>
<script src="assets/cytoscape-dagre.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const CARD_WIDTH = 220, CARD_HEIGHT = 58, CARD_PORTS_HEIGHT = 26;
const KIND_TINT = { Node: '--kind-node', Service: '--kind-service', Gateway: '--kind-service', Clients: '--kind-outside', LAN: '--kind-outside', External: '--kind-outside', World: '--kind-outside' };
let graph = { nodes: [], edges: [] };
let mode = 'live', laidOut = false, selected = null, cy = null, policyView = null;
// The doctor's latest survey, read every 15 s.
let health = { at: null, problems: [], warnings: [] }, healthRead = 0;
const cards = new Map();

function rate(n, window) {
  const r = n / { m1: 1, m5: 5, m15: 15 }[window];
  return (r >= 10 ? Math.round(r) : Math.round(r * 10) / 10) + '/min';
}
function kindLabel(node) { return node.software ? node.kind + ' · ' + node.software : node.kind; }
function el(tag, className, text) { const e = document.createElement(tag); if (className) e.className = className; if (text != null) e.textContent = text; return e; }

function makeGraph() {
  cy = cytoscape({ container: $('graph'), minZoom: 0.15, maxZoom: 2.5, wheelSensitivity: 0.25, style: [
    // The cards are HTML drawn over these nodes; the nodes only hold their place and take clicks.
    { selector: 'node', style: { shape: 'round-rectangle', width: 'data(width)', height: 'data(height)',
      'background-opacity': 0, 'border-width': 0, label: '' } },
    { selector: 'node[?group]', style: { 'background-color': css('--group'), 'background-opacity': 1, shape: 'round-rectangle',
      'corner-radius': 14, label: 'data(label)', 'text-valign': 'top', 'text-halign': 'center', 'text-margin-y': -6,
      'font-family': 'Inter, system-ui, sans-serif', 'font-size': 12, 'font-weight': 600, color: css('--muted'), padding: 22 } },
    { selector: 'edge', style: { width: 'data(width)', 'line-color': css('--edge'), 'target-arrow-color': css('--edge'),
      'target-arrow-shape': 'triangle', 'arrow-scale': 0.9, 'curve-style': 'bezier', 'control-point-step-size': 40,
      label: 'data(label)', 'font-family': 'Inter, system-ui, sans-serif', 'font-size': 10, 'font-weight': 500, color: css('--muted'),
      'text-background-color': css('--surface'), 'text-background-opacity': 1, 'text-background-padding': 3,
      'text-background-shape': 'round-rectangle', 'text-border-color': css('--line'), 'text-border-width': 1, 'text-border-opacity': 1 } },
    { selector: 'edge[?errors]', style: { 'line-color': css('--warn'), 'target-arrow-color': css('--warn'), color: css('--warn') } },
    { selector: 'edge[?dropped]', style: { 'line-color': css('--bad'), 'target-arrow-color': css('--bad'), 'line-style': 'dashed',
      'line-dash-pattern': [6, 4], color: css('--bad') } },
    { selector: 'edge.hover, edge:selected', style: { 'line-color': css('--accent'), 'target-arrow-color': css('--accent'), color: css('--accent'), 'z-index': 10 } },
    { selector: '.faded', style: { opacity: 0.18 } }] });
  cy.on('tap', 'node[!group]', (event) => select({ type: 'node', id: event.target.id() }));
  cy.on('tap', 'edge', (event) => select({ type: 'edge', id: event.target.id() }));
  cy.on('tap', (event) => { if (event.target === cy) select(null); });
  cy.on('mouseover', 'node[!group]', (event) => { const c = cards.get(event.target.id()); if (c) c.classList.add('hover'); $('graph').style.cursor = 'pointer'; });
  cy.on('mouseout', 'node[!group]', (event) => { const c = cards.get(event.target.id()); if (c) c.classList.remove('hover'); $('graph').style.cursor = ''; });
  cy.on('mouseover', 'edge', (event) => { event.target.addClass('hover'); $('graph').style.cursor = 'pointer'; });
  cy.on('mouseout', 'edge', (event) => { event.target.removeClass('hover'); $('graph').style.cursor = ''; });
  let frame = null;
  cy.on('render', () => { if (!frame) frame = requestAnimationFrame(() => { frame = null; placeCards(); }); });
}

// Each card follows its node: same centre, scaled with the zoom.
function placeCards() {
  const zoom = cy.zoom();
  cy.nodes('[!group]').forEach((node) => {
    const card = cards.get(node.id());
    if (!card) return;
    const p = node.renderedPosition();
    const w = node.data('width'), h = node.data('height');
    card.style.transform = `translate(${p.x - (w * zoom) / 2}px, ${p.y - (h * zoom) / 2}px) scale(${zoom})`;
  });
}

function inboundPorts(id, window) {
  const counts = new Map();
  for (const e of graph.edges) if (e.target === id && e[window].flows > 0)
    for (const port of e.ports) if (!port.startsWith('+')) counts.set(port, (counts.get(port) || 0) + e[window].flows);
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([port]) => port);
}

function droppedTo(id, window) { return graph.edges.reduce((n, e) => n + (e.target === id ? e[window].dropped : 0), 0); }

function iconTile(node) {
  const tile = el('div', 'tile');
  if (node.favicon) {
    // The app's own icon, read from its web UI by the dashboard; a raster image, never SVG.
    const img = el('img'); img.src = 'favicon?node=' + encodeURIComponent(node.id); img.alt = '';
    img.onerror = () => {
      node.favicon = false;
      const plain = iconTile(node);
      if (isolatedBy(node).length) plain.append(shield());
      tile.replaceWith(plain);
    };
    tile.append(img);
  } else if (node.icon.startsWith('lucide-')) {
    const mask = el('div', 'mask');
    mask.style.setProperty('--icon', `url(icons/${node.icon}.svg)`);
    mask.style.background = `var(${KIND_TINT[node.kind] || '--kind-workload'})`;
    tile.append(mask);
  } else {
    const img = el('img'); img.src = `icons/${node.icon}.svg`; img.alt = ''; tile.append(img);
  }
  return tile;
}

// The NetworkPolicies that isolate a workload's Pods, either way.
function isolatedBy(node) {
  const i = node.isolation;
  return i ? [...new Set([...i.ingress, ...i.egress])] : [];
}

function shield() {
  const span = el('span', 'shield');
  span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4" stroke-linecap="round"/></svg>';
  span.title = 'A NetworkPolicy isolates it';
  return span;
}

function renderCard(node, window) {
  let card = cards.get(node.id);
  if (!card) { card = el('div', 'card'); $('cards').append(card); cards.set(node.id, card); }
  const ports = inboundPorts(node.id, window);
  const dropped = droppedTo(node.id, window);
  const isolated = isolatedBy(node);
  const h = node.health;
  card.classList.toggle('cause', !!(h && h.problems));
  card.classList.toggle('affected', !!(h && !h.problems && h.affectedBy));
  const key = JSON.stringify([node.name, node.kind, node.software, node.icon, node.favicon, ports.slice(0, 3), ports.length, dropped, isolated, h]);
  if (card.dataset.key === key) return ports.length ? CARD_HEIGHT + CARD_PORTS_HEIGHT : CARD_HEIGHT;
  card.dataset.key = key;
  const names = el('div', 'names');
  names.append(el('div', 'name', node.name), el('div', 'kind', kindLabel(node)));
  const top = el('div', 'top');
  const tile = iconTile(node);
  if (isolated.length) tile.append(shield());
  top.append(tile, names);
  if (dropped) top.append(el('span', 'badge', dropped + ' dropped'));
  const parts = [top];
  if (ports.length) {
    // Whole chips only: the three busiest ports, then how many more.
    const row = el('div', 'ports');
    for (const port of ports.slice(0, 3)) {
      const [number, proto] = port.includes('/') ? port.split('/') : ['', port];
      const chip = el('span', 'chip', number || proto);
      if (number) chip.append(el('span', 'proto', proto.toLowerCase()));
      row.append(chip);
    }
    if (ports.length > 3) row.append(el('span', 'chip more', '+' + (ports.length - 3)));
    parts.push(row);
  }
  card.replaceChildren(...parts);
  card.title = node.name + ' (' + kindLabel(node) + (node.namespace ? ' in ' + node.namespace : '') + ')'
    + (isolated.length ? '\nIsolated by ' + isolated.join(', ') : '')
    + (h && h.problems ? '\n' + h.title + (h.problems > 1 ? ' (and ' + (h.problems - 1) + ' more)' : '') : '')
    + (h && h.affectedBy ? '\nHeld up by ' + h.affectedBy + ' problem' + (h.affectedBy > 1 ? 's' : '') + ' elsewhere' : '');
  const height = ports.length ? CARD_HEIGHT + CARD_PORTS_HEIGHT : CARD_HEIGHT;
  card.style.height = height + 'px';
  return height;
}

function visibleGraph() {
  const window = $('window').value, namespace = $('namespace').value, verdict = $('verdict').value;
  const search = $('search').value.trim().toLowerCase();
  const byId = new Map(graph.nodes.map((n) => [n.id, n]));
  let edges = graph.edges.filter((e) => e[window].flows > 0 && (verdict === 'all' || e[window].dropped > 0));
  if (namespace) {
    const touches = (e) => (byId.get(e.source) || {}).namespace === namespace || (byId.get(e.target) || {}).namespace === namespace;
    // A Gateway feeding the namespace brings the traffic into it: keep that hop too.
    const gateways = new Set(edges.filter(touches).map((e) => e.source).filter((id) => (byId.get(id) || {}).kind === 'Gateway'));
    edges = edges.filter((e) => touches(e) || gateways.has(e.target));
  }
  if (search) edges = edges.filter((e) => [e.source, e.target].some((id) => (byId.get(id) || { name: '' }).name.toLowerCase().includes(search)));
  const ids = new Set(edges.flatMap((e) => [e.source, e.target]));
  return { nodes: graph.nodes.filter((n) => ids.has(n.id)), edges, window };
}

function elements(view) {
  const groups = [...new Set(view.nodes.map((n) => n.namespace).filter(Boolean))].sort();
  const els = groups.map((ns) => ({ group: 'nodes', data: { id: 'ns:' + ns, label: ns, group: true } }));
  for (const n of view.nodes) {
    const height = renderCard(n, view.window);
    els.push({ group: 'nodes', data: { id: n.id, width: CARD_WIDTH, height, parent: n.namespace ? 'ns:' + n.namespace : undefined } });
  }
  for (const e of view.edges) {
    const w = e[view.window];
    const parts = [e.ports.join(' '), rate(w.flows, view.window)];
    if (w.dropped) parts.push(w.dropped + ' dropped');
    if (w.errors) parts.push(w.errors + ' errors');
    els.push({ group: 'edges', data: { id: e.id, source: e.source, target: e.target, label: parts.filter(Boolean).join(' · '),
      width: Math.min(6, 1.2 + Math.log2(1 + w.flows) * 0.7), dropped: w.dropped > 0, errors: w.errors > 0 } });
  }
  return els;
}

function layout(pinned) {
  if (mode === 'flow') return cy.layout({ name: 'dagre', rankDir: 'LR', nodeSep: 40, rankSep: 120, fit: !laidOut, padding: 40 }).run();
  const settings = { name: 'fcose', quality: 'proof', animate: false, nodeRepulsion: 12000, idealEdgeLength: 170,
    nodeSeparation: 90, randomize: !pinned, fit: !pinned, padding: 40 };
  if (pinned && pinned.length) settings.fixedNodeConstraint = pinned;
  cy.layout(settings).run();
}

function draw() {
  const view = visibleGraph();
  const empty = view.edges.length === 0;
  $('empty').hidden = !empty;
  $('graph').hidden = empty;
  $('cards').hidden = empty;
  if (empty) {
    $('empty').textContent = graph.edges.length ? 'Nothing matches the filters.' : 'No traffic seen yet.';
    return;
  }
  const wanted = elements(view);
  const wantedIds = new Set(wanted.map((e) => e.data.id));
  for (const [id, card] of cards) if (!wantedIds.has(id)) { card.remove(); cards.delete(id); }
  const pinned = [];
  cy.batch(() => {
    cy.elements().filter((e) => !wantedIds.has(e.id())).remove();
    cy.nodes('[!group]').forEach((n) => pinned.push({ nodeId: n.id(), position: { ...n.position() } }));
    for (const item of wanted) {
      const existing = cy.getElementById(item.data.id);
      if (existing.nonempty()) { existing.data(item.data); continue; }
      if (item.group === 'nodes' && !item.data.group) {
        // A new node starts beside a node it talks to, so the layout only has to nudge it.
        const neighbour = view.edges.map((e) => e.source === item.data.id ? e.target : e.target === item.data.id ? e.source : null)
          .map((id) => id && cy.getElementById(id)).find((n) => n && n.nonempty());
        if (neighbour) item.position = { x: neighbour.position().x + 80, y: neighbour.position().y + 80 };
      }
      cy.add(item);
    }
  });
  const added = cy.nodes('[!group]').filter((n) => !pinned.some((p) => p.nodeId === n.id()));
  if (!laidOut) { layout(); laidOut = true; }
  else if (added.nonempty()) layout(mode === 'live' ? pinned : null);
  placeCards();
  if (selected) mark();
}

function namespaces() {
  const select = $('namespace'), current = linked.ns ?? select.value;
  const names = [...new Set(graph.nodes.map((n) => n.namespace).filter(Boolean))].sort();
  select.replaceChildren(new Option('All namespaces', ''), ...names.map((n) => new Option(n, n)));
  select.value = names.includes(current) ? current : '';
  delete linked.ns;
}

// The view lives in the URL's hash, so it can be linked: #ns=cave&window=m15&edge=…&flows
const linked = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
function saveView() {
  const view = new URLSearchParams();
  if ($('namespace').value) view.set('ns', $('namespace').value);
  if ($('window').value !== 'm5') view.set('window', $('window').value);
  if ($('verdict').value !== 'all') view.set('verdict', $('verdict').value);
  if (selected) view.set(selected.type, selected.id);
  if (!$('flowtable').hidden) view.set('flows', '');
  const hash = view.toString().replace(/flows=(&|$)/, 'flows$1');
  history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
}

async function poll() {
  try {
    const response = await fetch('graph');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    graph = await response.json();
    if (Date.now() - healthRead > 15000) {
      healthRead = Date.now();
      try { health = await (await fetch('health')).json(); } catch (error) { /* keep the last */ }
      const count = health.problems.length;
      $('healthcount').textContent = health.at ? count : '…';
      $('healthcount').className = 'pill' + (count ? '' : ' ok');
    }
    namespaces();
    draw();
    if (selected) showDetails();
    if (!$('flowtable').hidden) await showFlows();
    $('status').textContent = graph.nodes.length + ' workloads · ' + graph.edges.length + ' connections';
    $('status').className = '';
  } catch (error) {
    $('status').textContent = 'Cannot read the graph: ' + error.message;
    $('status').className = 'bad';
  }
}

function mark() {
  cy.elements().removeClass('faded');
  for (const card of cards.values()) card.classList.remove('faded', 'selected');
  if (!selected) return;
  const item = cy.getElementById(selected.id);
  if (item.empty()) return;
  const near = selected.type === 'node' ? item.closedNeighborhood() : item.union(item.connectedNodes());
  cy.elements().not(near).not(near.parents()).not('[?group]').addClass('faded');
  for (const [id, card] of cards) if (!near.getElementById(id).nonempty()) card.classList.add('faded');
  if (selected.type === 'node' && cards.get(selected.id)) cards.get(selected.id).classList.add('selected');
}

function select(what) { selected = what; mark(); showDetails(); saveView(); }

function cell(text, cls) { return el('td', cls, text); }
function row(...cells) { const tr = el('tr'); tr.append(...cells); return tr; }
function head(...names) { return row(...names.map((n) => el('th', null, n))); }

// The panel is redrawn on every poll only when what it shows has changed, built whole
// before it replaces the old one, and keeps where the reader had scrolled: rebuilding it
// every two seconds made it flash and lost the scroll.
let panelKey = null, panelSequence = 0;
function setPanel(selection, data, nodes) {
  const aside = $('details');
  const key = selection + '\u0000' + JSON.stringify(data);
  if (key === panelKey) return;
  const same = panelKey !== null && panelKey.startsWith(selection + '\u0000');
  const top = aside.scrollTop, left = aside.scrollLeft;
  panelKey = key;
  aside.replaceChildren(...nodes);
  aside.scrollTop = same ? top : 0;
  aside.scrollLeft = same ? left : 0;
}

async function showDetails() {
  const aside = $('details');
  const sequence = ++panelSequence;
  $('showhealth').setAttribute('aria-pressed', selected?.type === 'health');
  if (!selected) { aside.hidden = true; panelKey = null; cy.resize(); return; }
  if (aside.hidden) { aside.hidden = false; cy.resize(); }
  const window = $('window').value;
  const nodeName = (id) => (graph.nodes.find((n) => n.id === id) || { name: id }).name;
  if (selected.type === 'health') { showHealthList(); return; }
  if (selected.type === 'node') {
    const node = graph.nodes.find((n) => n.id === selected.id);
    if (!node) { select(null); return; }
    const table = el('table');
    table.append(head('', 'Peer', 'Ports', 'Rate', 'Dropped'));
    for (const e of graph.edges.filter((e) => (e.source === node.id || e.target === node.id) && e[window].flows > 0)
                               .sort((a, b) => b[window].flows - a[window].flows)) {
      const out = e.source === node.id;
      const peer = cell(nodeName(out ? e.target : e.source), 'link');
      peer.onclick = () => select({ type: 'edge', id: e.id });
      table.append(row(cell(out ? '→' : '←'), peer, cell(e.ports.join(' ')), cell(rate(e[window].flows, window), 'num'),
        cell(e[window].dropped || '', e[window].dropped ? 'num dropped' : 'num')));
    }
    const sub = el('div', 'sub', kindLabel(node) + (node.namespace ? ' in ' + node.namespace : ''));
    if (headlampPath(node.kind, node.namespace, node.name))
      sub.append(' · ', headlampLink('Open in Headlamp', node.kind, node.namespace, node.name));
    setPanel('node:' + node.id,
      [node, window, graph.edges.filter((e) => e.source === node.id || e.target === node.id)
                                .map((e) => [e.id, e.ports, e[window]]), health.at, health.problems.length],
      [el('h2', null, node.name), sub, ...healthSection(node), ...isolationSection(node),
       el('h3', null, 'Connections'), table]);
    return;
  }
  const edge = graph.edges.find((e) => e.id === selected.id);
  if (!edge) { select(null); return; }
  const counts = el('table');
  counts.append(head('', '1 min', '5 min', '15 min'));
  for (const [label, key] of [['Flows', 'flows'], ['Dropped', 'dropped'], ['HTTP 5xx', 'errors']])
    counts.append(row(cell(label), ...['m1', 'm5', 'm15'].map((w) => cell(edge[w][key], 'num'))));
  const flows = el('table');
  flows.append(head('Time', 'From → to', 'Port', 'Verdict'));
  // The policy view keeps its element across redraws and re-reads the policies every
  // 15 s, in place, so a suggestion being copied stays put.
  if (!policyView || policyView.edge !== edge.id) policyView = { edge: edge.id, at: 0, node: el('div') };
  if (Date.now() - policyView.at >= 15000) { policyView.at = Date.now(); explainEdge(edge, policyView.node); }
  // The flows first, so the panel is swapped in whole.
  let latest;
  try { latest = await (await fetch('flows?edge=' + encodeURIComponent(edge.id))).json(); }
  catch (error) { latest = { error: error.message }; }
  if (sequence !== panelSequence) return;  // a newer redraw has started
  const traces = el('div');
  if (Array.isArray(latest)) {
    showTraces(latest, traces);
    for (const f of latest) {
      const [from, to, port] = flowSides(f);
      const http = f.l7 ? ' ' + f.l7.method + ' ' + f.l7.path + ' → ' + f.l7.code : '';
      flows.append(row(cell((f.time || '').slice(11, 19)), cell(from + ' → ' + to + http),
        cell((port == null ? '' : port + '/') + (f.protocol || '')),
        cell(f.verdict.toLowerCase() + dropReason(f), f.verdict === 'DROPPED' ? 'dropped' : '')));
    }
  } else flows.append(row(cell('Cannot read the flows: ' + latest.error)));
  setPanel('edge:' + edge.id, [edge.ports, edge.latencyMs, edge.m1, edge.m5, edge.m15, latest],
    [el('h2', null, nodeName(edge.source) + ' → ' + nodeName(edge.target)),
     el('div', 'sub', edge.ports.join(' ') + (edge.latencyMs != null ? ' · median ' + edge.latencyMs + ' ms' : '')),
     counts, traces, el('h3', null, 'Policy'), policyView.node, el('h3', null, 'Latest flows'), flows]);
}

// The edge's traced requests, slowest first (podster-krg.3): a Gateway's request carries
// the trace it was recorded in, which the dashboard's trace tab -- a DashboardTab with
// spec.traces, such as Grafana with Tempo -- opens.
function traceTab() {
  try { return window.parent !== window && window.parent.document.querySelector('[role=tab][data-traces]:not([data-traces=""])'); }
  catch (error) { return null; }
}

function showTraces(flows, into) {
  const traced = flows.filter((f) => f.l7 && /^[0-9a-f]{32}$/.test(f.l7.traceId || ''))
    .sort((a, b) => (b.l7.latencyNs || 0) - (a.l7.latencyNs || 0)).slice(0, 8);
  if (!traced.length) { into.replaceChildren(); return; }
  const tab = traceTab();
  const table = el('table');
  table.append(head('Time', 'Request', 'Status', 'Latency'));
  for (const f of traced) {
    const request = cell(f.l7.method + ' ' + f.l7.path);
    if (tab) {
      const a = el('a', 'link', f.l7.method + ' ' + f.l7.path);
      a.href = '#'; a.title = 'Open trace ' + f.l7.traceId + ' in ' + tab.textContent;
      a.onclick = (event) => {
        event.preventDefault();
        window.parent.postMessage({ open: 'trace', traceId: f.l7.traceId }, location.origin);
      };
      request.replaceChildren(a);
    }
    table.append(row(cell((f.time || '').slice(11, 19)), request,
      cell(String(f.l7.code), f.l7.code >= 500 ? 'dropped' : ''), cell((f.l7.latencyNs / 1e6).toFixed(0) + ' ms', 'num')));
  }
  into.replaceChildren(el('h3', null, 'Traces'), table,
    el('div', 'note', tab ? 'The slowest recent requests; each opens its trace in ' + tab.textContent + '.'
                          : 'The slowest recent requests. A DashboardTab with spec.traces (Grafana with Tempo, say) makes each one open its trace.'));
}

// Headlamp's page for a resource, when this page is a tab of the dashboard beside it.
const HEADLAMP_KINDS = { Deployment: 'deployments', StatefulSet: 'statefulsets', DaemonSet: 'daemonsets', Job: 'jobs',
                         Pod: 'pods', Service: 'services', NetworkPolicy: 'networkpolicies' };
function headlampPath(kind, namespace, name) {
  if (window.parent === window) return null;
  if (kind === 'Node') return 'c/gr8s/nodes/' + encodeURIComponent(name);
  return HEADLAMP_KINDS[kind] && namespace
    ? 'c/gr8s/' + HEADLAMP_KINDS[kind] + '/' + encodeURIComponent(namespace) + '/' + encodeURIComponent(name) : null;
}
function headlampLink(text, kind, namespace, name) {
  const path = headlampPath(kind, namespace, name);
  if (!path) return document.createTextNode(text);
  const a = el('a', 'link', text);
  a.href = '#'; a.title = 'Open ' + kind + ' ' + (namespace ? namespace + '/' : '') + name + ' in Headlamp';
  a.onclick = (event) => { event.preventDefault(); window.parent.postMessage({ open: 'headlamp', path }, location.origin); };
  return a;
}
// "namespace/name" of NetworkPolicies, each a link to it in Headlamp.
function policyLinks(names) {
  const out = [];
  names.forEach((qualified, i) => {
    if (i) out.push(document.createTextNode(', '));
    const [namespace, name] = qualified.split('/');
    out.push(headlampLink(qualified, 'NetworkPolicy', namespace, name));
  });
  return out;
}

// ---- The doctor on the map

// A doctor's target, Kind/namespace/name, as text: a link to its node when the map draws it.
function targetLink(target, nodeId) {
  const parts = target.split('/'), text = parts[0] + ' ' + parts.slice(1).join('/');
  if (!nodeId || !graph.nodes.some((n) => n.id === nodeId)) return document.createTextNode(text);
  const a = el('a', 'link', text); a.href = '#';
  a.onclick = (event) => { event.preventDefault(); select({ type: 'node', id: nodeId }); };
  return a;
}

function ago(iso) {
  const seconds = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  return seconds < 90 ? 'just now' : seconds < 5400 ? Math.round(seconds / 60) + ' minutes ago'
    : seconds < 129600 ? Math.round(seconds / 3600) + ' hours ago' : Math.round(seconds / 86400) + ' days ago';
}

function problemBox(problem, held) {
  const box = el('div', 'problem' + (held ? ' held' : ''));
  box.append(el('div', 'title', problem.title));
  const meta = [problem.causeFound ? 'cause' : 'symptom; the doctor found no deeper cause'];
  if (problem.since) meta.push('since ' + ago(problem.since));
  box.append(el('div', 'meta', meta.join(' · ')));
  if (problem.summary && problem.summary !== problem.title) box.append(el('p', null, problem.summary));
  if (problem.nextStep) box.append(el('p', 'next', problem.nextStep));
  if (problem.commands && problem.commands.length) box.append(el('pre', null, problem.commands.join('\n')));
  const where = el('p', 'next');
  where.append('About ');
  problem.resources.forEach((target, i) => where.append(i ? ', ' : '', targetLink(target, problem.nodes[i] || problem.nodes[0])));
  box.append(where);
  if (Array.isArray(problem.impact) && problem.impact.length) {
    const list = el('ul');
    for (const entry of problem.impact.slice(0, 8)) {
      const li = el('li'); li.append(targetLink(entry.target, null), entry.certain ? '' : ' (possibly)'); list.append(li);
    }
    if (problem.impact.length > 8) list.append(el('li', null, (problem.impact.length - 8) + ' more'));
    box.append(el('div', 'meta', 'Holds up'), list);
  }
  return box;
}

function healthSection(node) {
  const about = health.problems.filter((p) => p.nodes.includes(node.id));
  const held = health.problems.filter((p) => p.affectedNodes.includes(node.id));
  if (!about.length && !held.length) return [];
  const out = [el('h3', null, 'Health')];
  for (const p of about) out.push(problemBox(p, false));
  if (held.length) {
    out.push(el('div', 'note', 'Held up by a problem elsewhere:'));
    for (const p of held) out.push(problemBox(p, true));
  }
  return out;
}

function showHealthList() {
  const onMap = (p) => [...p.nodes, ...p.affectedNodes].some((id) => graph.nodes.some((n) => n.id === id));
  const items = [el('h2', null, 'Health'),
    el('div', 'sub', health.at ? 'The doctor read the cluster ' + ago(new Date(health.at * 1000).toISOString())
      + '; it reads it again every minute.' : 'The doctor is reading the cluster…')];
  if (health.at && !health.problems.length) items.push(el('div', 'note', 'The doctor finds nothing wrong it can see.'));
  const shown = health.problems.filter(onMap), elsewhere = health.problems.filter((p) => !onMap(p));
  if (shown.length) items.push(el('h3', null, 'On the map'), ...shown.map((p) => problemBox(p, false)));
  if (elsewhere.length) items.push(el('h3', null, 'Not on the map (no traffic seen)'), ...elsewhere.map((p) => problemBox(p, false)));
  for (const w of health.warnings || []) items.push(el('div', 'note', w));
  items.push(el('div', 'note', 'Drops are on the map\'s edges, not listed here. A cause is the deepest finding the doctor could see, not proof of a root cause.'));
  setPanel('health', [health, Math.floor((Date.now() / 1000 - (health.at || 0)) / 60),
                      graph.nodes.map((n) => n.id)], items);
}

function isolationSection(node) {
  if (!node.isolation) return [];
  const { ingress, egress } = node.isolation;
  const line = (label, names, open) => {
    const div = el('div', 'side');
    div.append(el('b', null, label + ': '));
    if (names.length) div.append('only what ', ...policyLinks(names), ' allows');
    else div.append(open);
    return div;
  };
  const box = el('div', 'policy');
  box.append(line('Arriving', ingress, 'open, no policy isolates it'), line('Leaving', egress, 'open, no policy isolates it'));
  return [el('h3', null, 'Policy'), box];
}

const VERDICT_TEXT = { open: 'open: no policy isolates it this way', 'not-a-pod': 'outside the cluster: no policy applies here' };

function explainSide(label, side) {
  const div = el('div', 'side');
  div.append(el('b', null, label + ': '));
  if (side.verdict === 'allowed') {
    div.append('allowed by ');
    side.allowedBy.forEach((a, i) => div.append(i ? ', ' : '', ...policyLinks([a.policy]), ' (rule ' + a.rule + ')'));
  } else if (side.verdict === 'denied') {
    div.append('denied: ', ...policyLinks(side.isolatedBy), side.isolatedBy.length > 1 ? ' isolate' : ' isolates',
      ' it, and no rule admits this');
  } else div.append(VERDICT_TEXT[side.verdict]);
  const out = [div];
  if (side.suggestion) {
    const box = el('div', 'suggestion'), bar = el('div', 'bar'), copy = el('button', null, 'Copy');
    const pre = el('pre', null, side.suggestion.replace(/^#.*\n/, ''));
    bar.append(el('span', null, (side.suggestion.match(/^# (.*):\n/) || [, 'Suggested rule'])[1]), copy);
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(side.suggestion); copy.textContent = 'Copied'; }
      catch (error) { copy.textContent = 'Select and copy'; }
      setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
    };
    box.append(bar, pre);
    out.push(box);
  }
  return out;
}

const DROP_REASONS = {
  spoof: 'Dropped by gr8s\'s anti-spoofing check, not by NetworkPolicy: the Pod sent a packet from an address that isn\'t its own.',
  malformed: 'Dropped as malformed by the dataplane, not by NetworkPolicy.',
  unsupported: 'Dropped by the dataplane, not by NetworkPolicy: a kind of packet it doesn\'t forward.',
};

async function explainEdge(edge, into) {
  // Re-read every 15 s: the first read says so; a later one changes the view only when
  // the explanation has changed.
  if (!into.childNodes.length) into.replaceChildren(el('div', 'note', 'Reading the policies…'));
  let explained;
  try { explained = await (await fetch('explain?edge=' + encodeURIComponent(edge.id))).json(); }
  catch (error) { into.replaceChildren(el('div', 'note', 'Cannot read the policies: ' + error.message)); return; }
  if (selected?.id !== edge.id) return;
  const key = JSON.stringify(explained);
  if (into.dataset.key === key) return;
  into.dataset.key = key;
  if (!explained.length) {
    into.replaceChildren(el('div', 'note', 'No Pod-to-Pod connection here to explain: policy applies to Pods.'));
    return;
  }
  // Denied first: those are what needs a fix.
  const refused = (c) => c.dropReason || c.explanation.verdict === 'denied';
  explained.sort((a, b) => refused(b) - refused(a) || b.dropped - a.dropped);
  const boxes = explained.map((c) => {
    if (c.dropReason) {
      const box = el('div', 'policy denied');
      const conn = el('div', 'conn', c.source + ' → ' + (c.destination || 'an unknown address')
        + (c.port != null ? ' ' + c.port + '/' : ' ') + (c.protocol || ''));
      conn.append(el('span', 'verdict', 'dropped · ' + c.dropped));
      box.append(conn, el('div', 'side', DROP_REASONS[c.dropReason] || 'The dataplane dropped it (' + c.dropReason + '), not NetworkPolicy.'));
      return box;
    }
    const { egress, ingress, verdict } = c.explanation;
    const box = el('div', 'policy' + (verdict === 'denied' ? ' denied' : ''));
    const conn = el('div', 'conn', c.source + ' → ' + c.destination + ' ' + (c.port != null ? c.port + '/' : '') + c.protocol);
    conn.append(el('span', 'verdict', verdict + (c.dropped ? ' · ' + c.dropped + ' dropped' : '')));
    box.append(conn, ...explainSide('Leaving ' + c.source, egress), ...explainSide('Arriving at ' + c.destination, ingress));
    return box;
  });
  into.replaceChildren(...boxes, el('div', 'note', 'As the policies are now; a suggested rule is a starting point to review, never applied for you.'));
}

function dropReason(f) {
  if (f.verdict !== 'DROPPED') return '';
  return f.policies && f.policies.length ? ' by ' + f.policies.join(', ') : f.reason ? ' (' + f.reason + ')' : '';
}

// A flow's two ends, named as the graph names them: the Pod where the flow has one, else the
// node of the graph it was counted on (a Gateway, LAN clients, a node), with its address.
function flowSides(f) {
  const nodeName = (id) => { const n = graph.nodes.find((n) => n.id === id); return n ? n.name + ' (' + n.kind + ')' : null; };
  const [sourceId, targetId] = (f.edge || '>').split('>');
  const peerName = (id) => f.peerPod ? (f.peerNamespace ? f.peerNamespace + '/' : '') + f.peerPod
    : (nodeName(id) || '') + (f.peerAddress ? ' · ' + f.peerAddress : '');
  const pod = f.pod ? (f.namespace ? f.namespace + '/' : '') + f.pod : null;
  if (f.l7 && f.l7.route) return [peerName(sourceId), nodeName(targetId) || f.l7.route, f.l7.listenerPort];
  return f.direction === 'egress' ? [pod, peerName(targetId), f.peerPort] : [peerName(sourceId), pod, f.podPort];
}

async function showFlows() {
  const namespace = $('namespace').value, verdict = $('verdict').value;
  const search = $('search').value.trim().toLowerCase();
  const rows = [];
  for (const f of await (await fetch('flows')).json()) {
    if (verdict === 'dropped' && f.verdict !== 'DROPPED') continue;
    if (namespace && f.namespace !== namespace && f.peerNamespace !== namespace) continue;
    const [from, to, port] = flowSides(f);
    if (search && !(from + ' ' + to).toLowerCase().includes(search)) continue;
    const detail = f.verdict === 'DROPPED' ? dropReason(f).trim() : f.l7 ? f.l7.method + ' ' + f.l7.path + ' → ' + f.l7.code : '';
    const tr = row(cell((f.time || '').slice(11, 19)), cell(from), cell(to), cell((port == null ? '' : port + '/') + (f.protocol || '')),
      cell(f.verdict.toLowerCase(), f.verdict === 'DROPPED' ? 'dropped' : ''), cell(detail));
    tr.onclick = () => select({ type: 'edge', id: f.edge });
    rows.push(tr);
  }
  $('flowrows').replaceChildren(...rows);
}

function setMode(next) {
  mode = next;
  $('live').setAttribute('aria-pressed', mode === 'live');
  $('flow').setAttribute('aria-pressed', mode === 'flow');
  laidOut = false;
  draw();
}

const refilter = () => { laidOut = false; draw(); if (!$('flowtable').hidden) showFlows(); saveView(); };

document.fonts.ready.then(() => {
  makeGraph();
  $('live').onclick = () => setMode('live');
  $('flow').onclick = () => setMode('flow');
  $('tidy').onclick = () => { laidOut = false; draw(); };
  $('showhealth').onclick = () => select(selected?.type === 'health' ? null : { type: 'health', id: 'health' });
  $('showflows').onclick = () => {
    const open = $('flowtable').hidden;
    $('flowtable').hidden = !open;
    $('showflows').setAttribute('aria-pressed', open);
    if (open) showFlows();
    cy.resize();
    saveView();
  };
  for (const id of ['namespace', 'window', 'verdict']) $(id).onchange = refilter;
  $('search').oninput = refilter;
  for (const id of ['window', 'verdict'])
    if (linked[id] && [...$(id).options].some((o) => o.value === linked[id])) $(id).value = linked[id];
  if ('flows' in linked) $('showflows').click();
  poll().then(() => {
    // A linked selection, once the graph it names has been read.
    if ('health' in linked) select({ type: 'health', id: 'health' });
    else if (linked.edge && graph.edges.some((e) => e.id === linked.edge)) select({ type: 'edge', id: linked.edge });
    else if (linked.node && graph.nodes.some((n) => n.id === linked.node)) select({ type: 'node', id: linked.node });
    if (selected) cy.fit(undefined, 40);
  });
  setInterval(() => { if (!document.hidden) poll(); }, 2000);
});
</script>
</body>
