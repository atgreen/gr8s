<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gr8s agent</title>
<link rel="stylesheet" href="xterm.css">
<style>
:root { --bg: #ffffff; --panel: #f6f7f9; --line: #d9dde3; --text: #24292f; --muted: #6b7481; --accent: #1f6feb; --bad: #cf222e; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #15181d; --panel: #1d2026; --line: #343a44; --text: #d6dae0; --muted: #9aa3ae; --accent: #58a6ff; --bad: #ff7b72; }
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
header .label { color: var(--muted); }
button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 3px 10px; cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#status { margin-left: auto; color: var(--muted); }
#status.bad { color: var(--bad); }
[hidden] { display: none !important; }
#terminal { flex: 1; min-height: 0; padding: 4px 0 0 8px; background: #15181d; }
#empty { flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
</style>
</head>
<body>
<header>
  <span class="label">Start</span>
  <span id="choices"></span>
  <span id="running-label" class="label" hidden>Running</span>
  <span id="running"></span>
  <button id="stop" hidden>Stop</button>
  <span id="status" role="status"></span>
</header>
<div id="empty">Start an agent: it runs on this machine with your own login, and with
KUBECONFIG naming this dashboard's cluster. It keeps running when you switch tabs or
reload this page; Stop ends it.</div>
<div id="terminal" hidden></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
"use strict";
const base = location.pathname.replace(/[^/]*$/, "");
const $ = (id) => document.getElementById(id);
const remembered = "gr8s-agent-session";
let socket = null, term = null, fit = null, current = null, exited = false, retries = 0;

function status(text, bad) { $("status").textContent = text; $("status").className = bad ? "bad" : ""; }
function remember(id) { try { id ? sessionStorage.setItem(remembered, id) : sessionStorage.removeItem(remembered); } catch {} }
function recalled() { try { return sessionStorage.getItem(remembered); } catch { return null; } }

function sendSize() {
  if (socket && socket.readyState === WebSocket.OPEN && term)
    socket.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
}

function ensureTerminal() {
  $("empty").hidden = true;
  $("terminal").hidden = false;
  if (term) return;
  term = new Terminal({ cursorBlink: true, fontSize: 13, scrollback: 5000,
                        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace',
                        theme: { background: "#15181d" } });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("terminal"));
  term.onData((data) => { if (socket && socket.readyState === WebSocket.OPEN) socket.send(new TextEncoder().encode(data)); });
  term.onResize(sendSize);
  new ResizeObserver(() => { if (!$("terminal").hidden) fit.fit(); }).observe($("terminal"));
}

// Show the agent behind QUERY, "agent=ID" to start one or "session=ID" to attach.
function connect(query, label) {
  if (socket) { const old = socket; socket = null; old.close(); }
  ensureTerminal();
  term.reset();
  fit.fit();
  exited = false;
  const url = new URL(base + "pty?" + query, location.href);
  url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  socket = ws;
  status((query.startsWith("agent=") ? "Starting " : "Attaching to ") + label + "\u2026");
  ws.onopen = () => { retries = 0; $("stop").hidden = false; sendSize(); term.focus(); };
  ws.onmessage = (event) => {
    if (typeof event.data !== "string") { term.write(new Uint8Array(event.data)); return; }
    const message = JSON.parse(event.data);
    if (message.type === "session") {
      current = message;
      remember(message.id);
      status(message.label + " is running.");
      refreshRunning();
    } else if (message.type === "exit") {
      exited = true;
      remember(null);
      status((current ? current.label : label) + " exited with code " + message.code + ".", message.code !== 0);
      refreshRunning();
    }
  };
  ws.onclose = () => {
    if (socket !== ws) return;
    socket = null;
    $("stop").hidden = true;
    // A connection lost while the agent runs is only the page's: attach again.
    if (!exited && current && retries < 30) {
      retries += 1;
      status("Reconnecting to " + current.label + "\u2026");
      setTimeout(() => { if (!socket) connect("session=" + encodeURIComponent(current.id), current.label); }, 1000);
    }
  };
}

async function refreshRunning() {
  let sessions = [];
  try { sessions = await (await fetch(base + "sessions")).json(); } catch {}
  $("running").replaceChildren(...sessions.map((session) => {
    const button = document.createElement("button");
    button.textContent = session.label;
    button.title = "Show this " + session.label;
    button.setAttribute("aria-pressed", String(!!current && current.id === session.id && !exited));
    button.onclick = () => { current = session; connect("session=" + encodeURIComponent(session.id), session.label); };
    return button;
  }));
  $("running-label").hidden = sessions.length === 0;
  return sessions;
}

$("stop").onclick = () => {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "stop" }));
};

fetch(base + "agents").then((response) => response.json()).then((choices) => {
  for (const choice of choices) {
    const button = document.createElement("button");
    button.textContent = choice.label;
    button.onclick = () => { current = null; connect("agent=" + encodeURIComponent(choice.id), choice.label); };
    $("choices").append(button, " ");
  }
}).catch((error) => status("Could not list the agents: " + error.message, true));

// Back where this page left off: the agent it showed, if it still runs.
refreshRunning().then((sessions) => {
  const session = sessions.find((s) => s.id === recalled());
  if (session) { current = session; connect("session=" + encodeURIComponent(session.id), session.label); }
});
</script>
</body>
</html>
