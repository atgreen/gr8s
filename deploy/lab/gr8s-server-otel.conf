#
# Gateway tracing for a lab node: install as
# /etc/systemd/system/gr8s-server.service.d/otel.conf, then
# `systemctl daemon-reload && systemctl restart gr8s-server`.
# The address is the monitoring/tempo Service's ClusterIP on the lab cluster
# (`kubectl -n monitoring get svc tempo`); node hosts reach ClusterIPs directly.
[Service]
Environment=OTEL_EXPORTER_OTLP_ENDPOINT=http://10.96.0.29:4318
Environment=OTEL_RESOURCE_ATTRIBUTES=k8s.cluster.name=gr8s-lab
