#
# A tab in `gr8s dashboard` for one of the cluster's own apps (podster-ckt). It is
# cluster-scoped: whoever may create dashboardtabs decides what every reader's
# dashboard shows. The dashboard reaches the Service through the cluster API's
# services/proxy, and serves it from an origin of its own.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dashboardtabs.dashboard.gr8s.io
spec:
  group: dashboard.gr8s.io
  scope: Cluster
  names:
    kind: DashboardTab
    listKind: DashboardTabList
    plural: dashboardtabs
    singular: dashboardtab
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Title, type: string, jsonPath: .spec.title}
        - {name: Namespace, type: string, jsonPath: .spec.service.namespace}
        - {name: Service, type: string, jsonPath: .spec.service.name}
        - {name: Port, type: string, jsonPath: .spec.service.port}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [service]
              properties:
                title:
                  type: string
                  maxLength: 40
                  description: The tab's label; the DashboardTab's name by default.
                service:
                  type: object
                  required: [namespace, name, port]
                  properties:
                    namespace: {type: string}
                    name: {type: string}
                    port:
                      description: The Service port, by number or name.
                      x-kubernetes-int-or-string: true
                path:
                  type: string
                  pattern: '^/'
                  description: Where the tab opens in the app; / by default.
