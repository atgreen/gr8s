apiVersion: v1
kind: ServiceAccount
metadata:
  name: gr8s-net
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gr8s-net
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, services, endpoints, configmaps, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, grpcroutes, tcproutes, tlsroutes, referencegrants]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status, gateways/status, httproutes/status]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gr8s-net
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gr8s-net
subjects:
  - kind: ServiceAccount
    name: gr8s-net
    namespace: {{ .Release.Namespace }}
