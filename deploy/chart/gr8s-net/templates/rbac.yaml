apiVersion: v1
kind: ServiceAccount
metadata:
  name: gr8s-net
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gr8s-net
rules:
  # Dataplane (CNI + socket LB + NetworkPolicy): read-only, no secrets. These are
  # all a plain CNI install needs, and nothing here is a privilege-escalation or
  # data-exfiltration grant on its own.
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, services, endpoints, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  {{- if and .Values.cni.enabled (eq .Values.overlay.backend "wireguard") }}
  # WireGuard overlay only. The agent publishes this node's WireGuard public key
  # as an annotation on its own Node object so peers can discover it; that needs
  # patch on nodes. It is a node-object write (not secrets), scoped to a field
  # the agent owns, and granted only when the encrypted fabric is in use.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  {{- end }}
  {{- if and .Values.gateway.enabled .Values.gateway.tls.enabled }}
  # TLS listeners only. Reading Secrets is cluster-wide, so it is the one grant
  # that meaningfully widens a compromised node's blast radius (node-local secrets
  # -> every secret in the cluster). It is needed only to terminate TLS on each
  # node, so it is gated behind gateway.tls.enabled and left off entirely for
  # non-TLS Gateways.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  {{- end }}
  {{- if .Values.gateway.enabled }}
  # Gateway controller. The remaining grants are low marginal risk: Service writes
  # (LoadBalancer provisioning) and Gateway status writes, done by a single
  # leader-elected holder. Granted only when the Gateway controller runs.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, grpcroutes, tcproutes, tlsroutes, referencegrants]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status, gateways/status, httproutes/status]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, update, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gr8s-net
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gr8s-net
subjects:
  - kind: ServiceAccount
    name: gr8s-net
    namespace: {{ .Release.Namespace }}
