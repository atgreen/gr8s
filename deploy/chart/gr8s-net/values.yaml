image:
  repository: ghcr.io/atgreen/gr8s-net
  # Pinned to the exact release; :latest moves with every release.
  tag: v1.37.2-gr8s.2
  pullPolicy: IfNotPresent

# Host paths the agent owns.
paths:
  cniBin: /opt/cni/bin
  cniConf: /etc/cni/net.d
  bpf: /run/gr8s/bpf
  state: /var/lib/gr8s-cni
  socket: /run/gr8s

# Pod interface MTU (lower it when an encapsulating underlay needs headroom).
mtu: 1450

cni:
  # Pod networking: the CNI plugin and conflist install, IPAM from each node's
  # podCIDR, the overlay fabric, NetworkPolicy enforcement, and hostPort. This
  # is the feature that replaces the cluster's CNI and NetworkPolicy
  # controller; turn it off to run only the service LB and/or Gateway on top
  # of the incumbent CNI (they need Pod IPs reachable from the host network,
  # which most CNIs provide). At least one of the three features must be on.
  enabled: true

overlay:
  # The node-to-node Pod fabric (cni feature only).
  # "vxlan" tunnels Pod traffic unencrypted;
  # "wireguard" encrypts Pod-CIDR-to-Pod-CIDR traffic (only -- node and
  # API-server traffic stays in the clear, so the agent still bootstraps). Each
  # agent generates its own key pair and publishes the public key as a Node
  # annotation (gr8s.io/wireguard-public-key); peers discover one another from
  # the watched Node objects. WireGuard needs the `nodes` patch RBAC grant below.
  backend: vxlan
  # The shared UDP port WireGuard listens on, on every node's host network.
  wireguardListenPort: 51820

serviceLb:
  # Replace kube-proxy: serve Services (ClusterIP and NodePort), hostPort, and the
  # eBPF socket load balancer on every node. On by default; turn it off only when
  # another proxy still handles Services.
  enabled: true

apiServer:
  # When gr8s replaces kube-proxy (serviceLb.enabled), the agent cannot reach the
  # API server through the kubernetes Service ClusterIP: that path needs the
  # socket LB the agent is itself bringing up. Point these at the real API server
  # address the nodes reach over the host network (e.g. the control-plane node IP,
  # or a load-balanced endpoint) and its port. Required with serviceLb.enabled and
  # no other proxy; leave empty only if something already serves the ClusterIP.
  host: ""
  port: 6443

gateway:
  # Serve the Gateway API (GatewayClass gr8s.io/gateway-controller) from every node.
  enabled: false
  # Empty selects a served API automatically, preferring gateway.networking.k8s.io.
  # Set gateway.networking.x-k8s.io to select the experimental API explicitly.
  listenerSetAPIGroup: ""
  tls:
    # Grant the agent cluster-wide read on Secrets, for TLS listener certificates.
    # This is the one grant that turns a node compromise into cluster-wide secret
    # exposure, so it is off by default; enable it only if you run Gateways (or
    # Ingresses) that terminate TLS. Non-TLS Gateways need no Secret access.
    enabled: false
