# ocicl lint configuration for gr8s: `ocicl lint` reads this from the project root.
# Rules suppressed here are gr8s's deliberate style or ordinary Common Lisp idiom, not
# defects. Everything not listed is a finding to fix.

# Long lines are common where a docstring or a format string reads better whole.
max-line-length = 160

# special-name-style:   gr8s names defparameter constants +like-this+ on purpose
#                       (a defconstant can't hold a non-EQL value across reloads).
# use-first-rest:       CAR and CDR are the right words for conses, pairs and alists.
# naming-underscore:    only generated protobuf code uses them, after the .proto names.
# cond-test-no-exp:     (cond (x) ...) returning the test's value is idiomatic.
# missing-otherwise,
# cond-without-default: a CASE or COND that falls through to NIL means NIL.
# bare-progn-in-if,
# avoid-nesting,
# check-prefix:         style preferences gr8s doesn't follow.
suppress-rules = special-name-style, use-first-rest, naming-underscore, cond-test-no-exp, missing-otherwise, cond-without-default, bare-progn-in-if, avoid-nesting, check-prefix
