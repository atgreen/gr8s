//
// The messages gr8s needs to import an image archive through containerd's
// Transfer and Streaming services (api/services/transfer/v1,
// api/services/streaming/v1 and api/types/transfer). Field numbers follow
// containerd's definitions; fields gr8s doesn't use are left out. The
// services carry google.protobuf.Any, so gr8s names each message's containerd
// type itself and calls the methods by path.
syntax = "proto3";

package containerd.services.transfer.v1;

message Any {
  string type_url = 1;
  bytes value = 2;
}

message Empty {}

// containerd.services.streaming.v1.StreamInit
message StreamInit {
  string id = 1;
}

// containerd.types.transfer.Data
message Data {
  bytes data = 1;
}

// containerd.types.transfer.WindowUpdate
message WindowUpdate {
  int32 update = 1;
}

// containerd.types.transfer.ImageImportStream
message ImageImportStream {
  string stream = 1;
  string media_type = 2;
  bool force_compress = 3;
}

// containerd.types.Platform
message Platform {
  string os = 1;
  string architecture = 2;
  string variant = 3;
}

// containerd.types.transfer.ImageReference
message ImageReference {
  string name = 1;
  bool is_prefix = 2;
  bool allow_overwrite = 3;
  bool add_digest = 4;
  bool skip_named_digest = 5;
}

// containerd.types.transfer.UnpackConfiguration
message UnpackConfiguration {
  Platform platform = 1;
  string snapshotter = 2;
}

// containerd.types.transfer.ImageStore
message ImageStore {
  string name = 1;
  repeated Platform platforms = 3;
  repeated ImageReference extra_references = 6;
  repeated UnpackConfiguration unpacks = 10;
}

message TransferOptions {
  string progress_stream = 1;
}

message TransferRequest {
  Any source = 1;
  Any destination = 2;
  TransferOptions options = 3;
}
