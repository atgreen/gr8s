syntax = "proto3";

package gr8s.node.v1;

service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

service NodeService {
  rpc Connect(stream AgentEnvelope) returns (stream ServerEnvelope);
}

message EnrollRequest {
  uint32 protocol_version = 1;
  string node_name = 2;
  string join_token = 3;
  bytes certificate_request = 4;
}

message EnrollResponse {
  uint32 protocol_version = 1;
  string node_id = 2;
  bytes node_certificate = 3;
  bytes ca_certificate = 4;
}

message AgentEnvelope {
  uint32 protocol_version = 1;
  uint64 sequence = 2;
  oneof payload {
    NodeHello hello = 10;
    Heartbeat heartbeat = 11;
    SnapshotAck snapshot_ack = 12;
    NodeStatus status = 13;
    OperationResponse operation_response = 14;
    OperationStream operation_stream = 15;
  }
}

message ServerEnvelope {
  uint32 protocol_version = 1;
  uint64 sequence = 2;
  oneof payload {
    ServerHello hello = 10;
    DesiredStateSnapshot desired_state = 11;
    OperationRequest operation_request = 12;
    OperationInput operation_input = 13;
    OperationCancel operation_cancel = 14;
    ProtocolError protocol_error = 15;
  }
}

message NodeHello {
  string node_name = 1;
  string boot_id = 2;
  string agent_version = 3;
  uint64 last_applied_revision = 4;
  map<string, string> labels = 5;
  repeated string capabilities = 6;
  string underlay_address = 7;
  map<string, string> capacity = 8;
}

message Heartbeat {
  uint64 observed_at_unix_nanos = 1;
}

message SnapshotAck {
  uint64 revision = 1;
  bool applied = 2;
  string error_message = 3;
}

message NodeStatus {
  uint64 observed_at_unix_nanos = 1;
  repeated PodObservedStatus pods = 2;
  repeated EndpointTelemetry endpoints = 3;
  // Every CSI driver registered on this node, in full on each report.
  repeated CsiDriverRegistration csi_drivers = 4;
  // podCertificate projected volumes (KEP-4317): the node generates each pod's
  // keypair locally and reports only the public key, so the control plane can
  // create the PodCertificateRequest. The private key never leaves the node.
  repeated PodCertificateClaim pod_certificate_requests = 5;
}

// A node's request that the control plane create a PodCertificateRequest for a
// pod's podCertificate projected volume (KEP-4317). The control plane fills in
// the node name and UID from the authenticated session, never from the claim.
message PodCertificateClaim {
  string name = 1;              // deterministic PodCertificateRequest name
  string namespace = 2;         // the pod's namespace
  string signer_name = 3;
  string pkix_public_key = 4;   // base64 SubjectPublicKeyInfo DER
  string pod_name = 5;
  string pod_uid = 6;
  string service_account_name = 7;
  string service_account_uid = 8;
  int64 max_expiration_seconds = 9;
  string stub_pkcs10_request = 10; // base64 PKCS#10 DER signed by the pod key (certificates.k8s.io/v1)
}

message CsiDriverRegistration {
  string name = 1;
  string node_id = 2;
  int64 max_volumes = 3;
  map<string, string> topology = 4;
}

message EndpointTelemetry {
  string sandbox_id = 1;
  string interface_name = 2;
  string pod_ip = 3;
  uint64 allowed_packets = 4;
  uint64 allowed_bytes = 5;
  uint64 dropped_packets = 6;
  uint64 dropped_bytes = 7;
  uint64 rejected_spoofs = 8;
  uint64 malformed_packets = 9;
  uint64 unsupported_packets = 10;
  string error_message = 11;
}

message PodObservedStatus {
  string namespace = 1;
  string name = 2;
  string uid = 3;
  string resource_version = 4;
  string phase = 5;
  string reason = 6;
  string message = 7;
  string pod_ip = 8;
  bytes status_json = 9;
  // Physical cleanup can complete while public Pod finalizers retain the API object.
  bool runtime_deleted = 10;
}

enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_ACCEPTED = 1;
  OPERATION_STATUS_COMPLETE = 2;
  OPERATION_STATUS_FAILED = 3;
}

enum StreamChannel {
  STREAM_CHANNEL_UNSPECIFIED = 0;
  STREAM_CHANNEL_STDIN = 1;
  STREAM_CHANNEL_STDOUT = 2;
  STREAM_CHANNEL_STDERR = 3;
  STREAM_CHANNEL_TERMINAL_RESIZE = 4;
}

message OperationResponse {
  string operation_id = 1;
  OperationStatus status = 2;
  int32 exit_code = 3;
  string error_message = 4;
}

message OperationStream {
  string operation_id = 1;
  uint64 sequence = 2;
  StreamChannel channel = 3;
  bytes data = 4;
  bool eof = 5;
  // PORT_FORWARD: how much more input the node has written to the Pod.
  uint64 acknowledged_bytes = 6;
}

message ServerHello {
  string node_id = 1;
  uint32 heartbeat_interval_seconds = 2;
  string assigned_pod_cidr = 3;
}

message DesiredStateSnapshot {
  uint64 revision = 1;
  repeated PodAssignment pods = 2;
  NodeNetworkConfig network = 3;
  repeated NodeRoute routes = 4;
  // Public Service/EndpointSlice DNS data, separate from Pod-scoped secrets.
  repeated bytes service_discovery_objects_json = 5;
}

message PodAssignment {
  string namespace = 1;
  string name = 2;
  string uid = 3;
  string resource_version = 4;
  bytes pod_json = 5;
  bool deleting = 6;
  // Only ConfigMaps/Secrets referenced by this Pod, delivered over node mTLS.
  repeated bytes resource_objects_json = 7;
}

message NodeNetworkConfig {
  string cluster_pod_cidr = 1;
  string node_pod_cidr = 2;
  string dns_address = 3;
  uint32 vni = 4;
  uint32 mtu = 5;
  string underlay_address = 6;
}

message NodeRoute {
  string node_id = 1;
  string pod_cidr = 2;
  string underlay_address = 3;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_LOGS = 1;
  OPERATION_KIND_EXEC = 2;
  OPERATION_KIND_RECLAIM_VOLUME = 3;
  OPERATION_KIND_ATTACH = 4;
  OPERATION_KIND_METRICS = 5;
  OPERATION_KIND_PORT_FORWARD = 6;
}

message OperationRequest {
  string operation_id = 1;
  OperationKind kind = 2;
  string namespace = 3;
  string pod = 4;
  string pod_uid = 5;
  string container = 6;
  repeated string command = 7;
  bool stdin = 8;
  bool stdout = 9;
  bool stderr = 10;
  bool tty = 11;
  bool previous = 12;
  // The PersistentVolume whose provisioned directory RECLAIM_VOLUME removes.
  bytes volume_json = 13;
  // The port in the Pod's network namespace PORT_FORWARD connects to.
  uint32 port = 14;
}

message OperationInput {
  string operation_id = 1;
  uint64 sequence = 2;
  StreamChannel channel = 3;
  bytes data = 4;
  uint32 rows = 5;
  uint32 columns = 6;
  bool eof = 7;
  // PORT_FORWARD: how much more output has reached the client.
  uint64 acknowledged_bytes = 8;
}

message OperationCancel {
  string operation_id = 1;
  string reason = 2;
}

message ProtocolError {
  uint32 supported_version = 1;
  uint32 received_version = 2;
  string message = 3;
}

// The CNI executable is a thin local client.  It forwards the complete CNI
// invocation to the node agent over a private Unix socket; only the agent is
// allowed to mutate IPAM, links, routes, or BPF state.
message CniRequest {
  uint32 protocol_version = 1;
  string command = 2;
  bytes network_configuration = 3;
  string container_id = 4;
  string network_namespace = 5;
  string interface_name = 6;
  string arguments = 7;
  string plugin_path = 8;
}

message CniResponse {
  uint32 protocol_version = 1;
  bool success = 2;
  bytes result_json = 3;
  uint32 error_code = 4;
  string error_message = 5;
  string error_details = 6;
}

// Raft consensus transport between HA control-plane members (podster-c2d.3).
// A single one-way delivery carrying one serialized Raft message; replies flow
// as their own Deliver calls, matching the core's fire-and-forget send model.
service RaftTransport {
  rpc Deliver(RaftEnvelope) returns (RaftAck);
  // A new member asks the cluster to admit it (podster-c2d.10). Call it on any
  // member; a follower answers with accepted=false and the current leader's
  // address so the joiner can retry there. The leader authenticates the joiner,
  // proposes the membership change, and returns the member address book so the
  // joiner can reach every peer.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Exchange a one-time Raft join token for a member certificate. This is the only
  // call that doesn't need one, and the caller must first check the CA it pinned.
  rpc EnrollMember(EnrollMemberRequest) returns (EnrollMemberResponse);
  // Exchange a member's still-valid certificate for a new one with the same name.
  rpc RenewMember(RenewMemberRequest) returns (RenewMemberResponse);
}

message RenewMemberRequest {
  bytes certificate_request = 1;
}

message RenewMemberResponse {
  string certificate = 1;      // PEM chain for the member
}

message EnrollMemberRequest {
  string member_id = 1;
  string node_name = 2;   // the name the join token is bound to
  string join_token = 3;
  string role = 4;        // "voter" | "witness"
  bytes certificate_request = 5;
}

message EnrollMemberResponse {
  string certificate = 1;      // PEM chain for the member
  string ca_certificate = 2;
  string ca_private_key = 3;   // voters only, so they can admit members after a failover
  // Voters only, so agents and API clients keep working when another member takes over.
  string node_ca_certificate = 4;
  string node_ca_private_key = 5;
}

message RaftEnvelope {
  uint32 protocol_version = 1;
  bytes payload = 2;
}

message RaftAck {
}

message RaftMember {
  string id = 1;
  string host = 2;
  uint32 port = 3;
  string role = 4;   // "voter" | "witness"
}

message JoinRequest {
  string member_id = 1;
  string host = 2;
  uint32 port = 3;
  string role = 4;        // "voter" | "witness"
  string node_name = 5;   // the name the join token is bound to
  string join_token = 6;
  string api_url = 7;     // the joiner's HTTP API base URL, for leader-aware redirects
}

message JoinResponse {
  bool accepted = 1;
  string leader_id = 2;    // when not accepted: where to retry
  string leader_host = 3;
  uint32 leader_port = 4;
  repeated RaftMember members = 5;  // the address book, when accepted
}
