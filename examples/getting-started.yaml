apiVersion: v1
kind: Namespace
metadata:
  name: gr8s-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: gr8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: gr8s-demo
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: gr8s-demo
spec:
  containers:
    - name: client
      image: docker.io/library/busybox:1.36
      command: ["sleep", "3600"]
