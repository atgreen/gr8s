# nginx for a browser tab: a browser node runs containers as root in its tab, so the
# workers drop to the image's nginx user; logs go to the container's output.
user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    # The page's bytes are checked against the image, so they are sent as stored.
    sendfile off;
    gzip off;
    etag off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
    }
}
