name: Build and Release

on:
  push:
    tags: ['v*']
  # Build the selected ref and retain artifacts, without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out gr8s and version tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install bootstrap compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl build-essential curl ca-certificates \
            binutils cpio gzip python3 libzstd-dev libssl-dev libffi-dev

      # Build the same SBCL on both native architectures, rather than relying
      # on different distro compiler versions or cross-compiling dumped images.
      - name: Check out SBCL 2.6.10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sbcl/sbcl
          ref: ee8952af37ab5a2a2408e7bddd966f2a903ffe9d
          path: build/sbcl
          persist-credentials: false

      - name: Build and install SBCL
        working-directory: build/sbcl
        run: |
          # The pinned checkout is a bare commit, so SBCL's build cannot `git
          # describe` a version; supply the one the pin corresponds to.
          echo '"2.6.10"' > version.lisp-expr
          sh make.sh --fancy --prefix="$HOME/.local"
          sh install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check out ocicl 2.21.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ocicl/ocicl
          ref: a8607c9b8c7bcc375d553cebd866b120022a23b3
          path: build/ocicl-tool
          persist-credentials: false

      - name: Build and configure ocicl
        working-directory: build/ocicl-tool
        run: |
          sbcl --noinform --non-interactive --load setup.lisp
          ocicl setup > "$HOME/.sbclrc"

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Test release packaging
        run: python3 scripts/test_release_package.py

      - name: Build, smoke-test, and package the native executable
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: scripts/build-release.sh

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            build/release/gr8s-linux-*
            build/release/gr8s-*-linux-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  packages:
    name: Build RPM and DEB packages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out packaging sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download both architecture builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: build/release

      - name: Install nfpm 2.48.0
        run: |
          curl -fsSL --retry 3 -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  /tmp/nfpm.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf /tmp/nfpm.tar.gz nfpm

      - name: Build packages
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-gr8s.0' }}
        run: |
          PKG_OUTPUT_DIRECTORY=build/packages releng/build-packages.sh
          ls -l build/packages

      - name: Smoke-test the amd64 DEB
        run: |
          sudo dpkg -i build/packages/gr8s_*_amd64.deb
          gr8s version
          test -f /usr/lib/systemd/system/gr8s-server.service
          test -f /usr/lib/systemd/system/gr8s-agent.service
          test "$(stat -c %a /etc/gr8s/server.env)" = 600
          test "$(systemctl is-enabled gr8s-server.service || true)" = disabled
          sudo dpkg -P gr8s
          test ! -e /usr/bin/gr8s
          test ! -e /etc/gr8s/server.env

      - name: Upload package assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: build/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish tagged release
    needs: [build, packages]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out license files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download binaries, tarballs, and packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      # The installer and lifecycle scripts ship inside the tarballs, not as
      # loose release assets.
      - name: Verify assets and add license files
        run: |
          cp -f LICENSE NOTICE release/
          cd release
          sha256sum -c gr8s-linux-amd64.sha256 gr8s-linux-arm64.sha256
          sha256sum -- * > ../SHA256SUMS
          mv -f ../SHA256SUMS .

      # The tag's CHANGELOG.md section becomes the release notes; a tag
      # without one is a release-checklist miss, so the publish fails loudly
      # rather than falling back to auto-generated commit lists.
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$RELEASE_TAG" '
            $0 ~ "^## \\[" tag "\\]" {found=1; next}
            found && (/^## \[/ || /^\[/) {exit}
            found {print}
          ' CHANGELOG.md \
            | sed -E "s#\]\((docs|deploy|examples|src|tests|scripts)/#](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/\1/#g" \
            > release-notes.md
          test -s release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Every v1.37.2-gr8s.N tag is a trial pre-release while gr8s is in
          # trial; publish it flagged as such so it is never the "Latest"
          # release. Drop --prerelease when cutting the first stable release.
          gh release create "$RELEASE_TAG" --prerelease --verify-tag \
            --notes-file release-notes.md release/*

  # The packages and executables as one signed OCI artifact, which `gr8s upgrade'
  # installs from: ghcr.io/<owner>/gr8s-packages:<tag>. The release key signs it;
  # without the GR8S_RELEASE_SIGNING_KEY secret there is nothing to sign with, and
  # the job says so rather than publishing an artifact no host would trust.
  upgrade-artifact:
    name: Publish signed upgrade packages
    needs: [build, packages]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download binaries and packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Push and sign the release artifact
        env:
          GR8S_RELEASE_SIGNING_KEY: ${{ secrets.GR8S_RELEASE_SIGNING_KEY }}
          GR8S_REGISTRY_USERNAME: ${{ github.actor }}
          GR8S_REGISTRY_PASSWORD: ${{ github.token }}
          REFERENCE: ghcr.io/${{ github.repository_owner }}/gr8s-packages:${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GR8S_RELEASE_SIGNING_KEY" ]; then
            echo "::warning::GR8S_RELEASE_SIGNING_KEY is not set: no upgrade artifact published"
            exit 0
          fi
          chmod +x release/gr8s-linux-amd64
          release/gr8s-linux-amd64 upgrade publish --to "$REFERENCE" --version "$RELEASE_TAG" \
            release/gr8s-*.rpm release/gr8s_*.deb release/gr8s-linux-amd64 release/gr8s-linux-arm64

  image:
    name: Publish gr8s-net container image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the Containerfile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the amd64 build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-amd64
          path: release

      - name: Build and push ghcr.io image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/gr8s-net
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          mkdir -p build
          cp release/gr8s-linux-amd64 build/gr8s
          chmod +x build/gr8s
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman build -f deploy/Containerfile -t "$IMAGE:$TAG" .
          podman push "$IMAGE:$TAG"
          # A release also moves :latest. Every release is a trial pre-release,
          # so there is no stable one for :latest to stay on.
          if [ "$TAG" != latest ]; then
            podman tag "$IMAGE:$TAG" "$IMAGE:latest"
            podman push "$IMAGE:latest"
          fi
